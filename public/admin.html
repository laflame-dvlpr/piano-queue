<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piano Queue — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07050e;
  --surface:rgba(255,255,255,0.035);
  --surface-hover:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.07);
  --accent:#8b5cf6;--accent-dim:#7c3aed;--accent-light:#a78bfa;
  --glow:rgba(139,92,246,0.25);
  --text:#f0f0f0;--dim:#777;--faint:#444;
  --green:#22c55e;--red:#ef4444;--amber:#f59e0b;
  --radius:16px;--radius-sm:12px;
}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100dvh;padding:0 16px 60px;overflow-x:hidden;
}
.ambient{
  position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 60% at 20% 40%, rgba(88,28,135,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 20%, rgba(139,92,246,0.07) 0%, transparent 50%);
}
.container{max-width:600px;margin:0 auto}

/* ── Gate ── */
.gate{
  display:flex;align-items:center;justify-content:center;
  min-height:80dvh;
}
.gate-card{
  background:var(--surface);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:40px 32px;text-align:center;width:100%;max-width:380px;
}
.gate-card .lock{font-size:48px;margin-bottom:16px;display:block}
.gate-card h1{font-size:24px;font-weight:700;margin-bottom:8px}
.gate-card p{font-size:14px;color:var(--dim);margin-bottom:24px}
.gate-card input{
  width:100%;padding:14px 16px;
  background:rgba(0,0,0,0.35);border:1px solid var(--border);border-radius:var(--radius-sm);
  color:var(--text);font-size:15px;font-family:inherit;outline:none;text-align:center;
  transition:border-color .2s;margin-bottom:16px;
}
.gate-card input:focus{border-color:rgba(139,92,246,0.5)}
.gate-card .err-msg{color:var(--red);font-size:13px;margin-bottom:12px;display:none}
.btn{
  width:100%;padding:14px;border:none;border-radius:var(--radius-sm);
  background:linear-gradient(135deg,var(--accent-dim),var(--accent));
  color:#fff;font-size:15px;font-weight:600;font-family:inherit;
  cursor:pointer;transition:transform .15s,box-shadow .15s;
  box-shadow:0 4px 20px var(--glow);
}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 30px rgba(139,92,246,0.35)}
.btn:active{transform:scale(.98)}

/* ── Dashboard ── */
.dash{display:none}
.dash-head{display:flex;align-items:center;justify-content:space-between;padding:36px 0 4px}
.dash-head h1{
  font-size:28px;font-weight:800;
  background:linear-gradient(135deg,#fff 30%,var(--accent-light));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.dash-head a{color:var(--dim);font-size:13px;text-decoration:none;transition:color .2s}
.dash-head a:hover{color:var(--text)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.stat{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px 16px;text-align:center;
}
.stat .n{font-size:32px;font-weight:800;line-height:1}
.stat .n.purple{color:var(--accent-light)}
.stat .n.green{color:var(--green)}
.stat .n.white{color:var(--text)}
.stat .label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-top:6px}

/* Sections */
.sec{margin-top:32px}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-head h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim)}
.sec-head button{
  background:none;border:1px solid var(--border);border-radius:8px;
  color:var(--dim);font-size:12px;padding:6px 12px;cursor:pointer;font-family:inherit;
  transition:all .2s;
}
.sec-head button:hover{border-color:var(--accent);color:var(--accent)}

/* Queue items */
.qi{
  display:flex;align-items:center;gap:12px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:8px;
  animation:slideUp .4s ease both;
}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.qi .pos{
  width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--accent-dim),var(--accent));
  border-radius:50%;font-size:12px;font-weight:700;flex-shrink:0;
}
.qi .art{width:44px;height:44px;border-radius:8px;object-fit:cover;flex-shrink:0;background:rgba(255,255,255,0.04)}
.qi .meta{flex:1;overflow:hidden;min-width:0}
.qi .track{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qi .artist{font-size:12px;color:var(--dim)}
.qi .by{font-size:11px;margin-top:2px;display:flex;align-items:center;gap:4px}
.qi .by.public{color:var(--accent-light)}
.qi .by.private{color:var(--amber)}
.qi .actions{display:flex;gap:6px;flex-shrink:0}
.act{
  padding:8px 12px;border:none;border-radius:8px;
  font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;
  transition:transform .1s,opacity .2s;
}
.act:active{transform:scale(.95)}
.act.play{background:rgba(34,197,94,0.15);color:var(--green)}
.act.play:hover{background:rgba(34,197,94,0.25)}
.act.del{background:rgba(239,68,68,0.1);color:var(--red)}
.act.del:hover{background:rgba(239,68,68,0.2)}

/* History items */
.hi{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;border-bottom:1px solid var(--border);
}
.hi:last-child{border-bottom:none}
.hi .art{width:36px;height:36px;border-radius:6px;object-fit:cover;flex-shrink:0;background:rgba(255,255,255,0.04)}
.hi .meta{flex:1;overflow:hidden}
.hi .track{font-size:13px;font-weight:500}
.hi .artist{font-size:11px;color:var(--dim)}
.hi .ago{font-size:11px;color:var(--faint);white-space:nowrap}
.history-wrap{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;
}

.empty{text-align:center;color:var(--faint);padding:40px 0;font-size:14px}

/* Toast */
.toast{
  position:fixed;bottom:28px;left:16px;right:16px;
  max-width:520px;margin:0 auto;
  padding:14px 20px;border-radius:var(--radius-sm);
  font-size:14px;font-weight:500;
  transform:translateY(140%);transition:transform .35s cubic-bezier(.22,1,.36,1);
  z-index:200;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.toast.show{transform:translateY(0)}
.toast.ok{background:rgba(34,197,94,0.9);color:#fff}
.toast.err{background:rgba(239,68,68,0.9);color:#fff}
</style>
</head>
<body>
<div class="ambient"></div>
<div class="container">

  <!-- Gate -->
  <div class="gate" id="gate">
    <div class="gate-card">
      <span class="lock">&#127929;</span>
      <h1>Admin Access</h1>
      <p>Enter your admin token to manage the queue</p>
      <div class="err-msg" id="errMsg">Invalid token</div>
      <input type="password" id="tokenInput" placeholder="Admin token" autocomplete="off">
      <button class="btn" id="unlockBtn">Unlock</button>
    </div>
  </div>

  <!-- Dashboard -->
  <div class="dash" id="dash">
    <div class="dash-head">
      <h1>Admin</h1>
      <a href="index.html">&larr; Public page</a>
    </div>

    <div class="stats">
      <div class="stat"><div class="n purple" id="sQueued">0</div><div class="label">Queued</div></div>
      <div class="stat"><div class="n green" id="sPlayed">0</div><div class="label">Played</div></div>
      <div class="stat"><div class="n white" id="sTotal">0</div><div class="label">Total</div></div>
    </div>

    <div class="sec">
      <div class="sec-head">
        <h2>Active Queue</h2>
        <button id="refreshBtn">Refresh</button>
      </div>
      <div id="adminQ"></div>
    </div>

    <div class="sec">
      <div class="sec-head"><h2>Played History</h2></div>
      <div id="adminH"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API='';
const $=id=>document.getElementById(id);
let token='';

// Check stored token
try{token=sessionStorage.getItem('pq_token')||''}catch{}
if(token) verify(token);

// Unlock
$('unlockBtn').addEventListener('click',()=>verify($('tokenInput').value.trim()));
$('tokenInput').addEventListener('keydown',e=>{if(e.key==='Enter')verify($('tokenInput').value.trim())});

async function verify(t){
  if(!t)return;
  try{
    const r=await fetch(API+'/api/requests/stats',{headers:{'X-Admin-Token':t}});
    if(!r.ok){$('errMsg').style.display='block';return}
    token=t;
    try{sessionStorage.setItem('pq_token',t)}catch{}
    $('gate').style.display='none';
    $('dash').style.display='block';
    loadAll();
  }catch{$('errMsg').style.display='block'}
}

function hdrs(){return{'X-Admin-Token':token}}

async function loadAll(){
  loadStats();loadQueue();loadHistory();
}

async function loadStats(){
  try{
    const d=await(await fetch(API+'/api/requests/stats',{headers:hdrs()})).json();
    $('sQueued').textContent=d.queued;
    $('sPlayed').textContent=d.played;
    $('sTotal').textContent=d.total;
  }catch{}
}

async function loadQueue(){
  try{
    const items=await(await fetch(API+'/api/requests',{headers:hdrs()})).json();
    if(!items.length){$('adminQ').innerHTML='<div class="empty">Queue is empty</div>';return}
    $('adminQ').innerHTML=items.map(it=>`
      <div class="qi" data-id="${it.id}">
        <span class="pos">${it.position}</span>
        ${it.artworkUrl?`<img class="art" src="${esc(it.artworkUrl)}" alt="">`:'<div class="art"></div>'}
        <div class="meta">
          <div class="track">${esc(it.trackName)}</div>
          ${it.artistName?`<div class="artist">${esc(it.artistName)}</div>`:''}
          ${it.requesterName?`<div class="by ${it.namePublic?'public':'private'}">${it.namePublic?'':'&#128274; '}${esc(it.requesterName)}</div>`:''}
        </div>
        <div class="actions">
          <button class="act play" onclick="markPlayed(${it.id})">&#9654; Played</button>
          <button class="act del" onclick="removeItem(${it.id})">&#10005;</button>
        </div>
      </div>`).join('');
  }catch{$('adminQ').innerHTML='<div class="empty">Error loading queue</div>'}
}

async function loadHistory(){
  try{
    const items=await(await fetch(API+'/api/requests/history')).json();
    if(!items.length){$('adminH').innerHTML='<div class="empty">Nothing played yet</div>';return}
    $('adminH').innerHTML='<div class="history-wrap">'+items.map(it=>`
      <div class="hi">
        ${it.artworkUrl?`<img class="art" src="${esc(it.artworkUrl)}" alt="">`:'<div class="art"></div>'}
        <div class="meta">
          <div class="track">${esc(it.trackName)}</div>
          ${it.artistName?`<div class="artist">${esc(it.artistName)}</div>`:''}
        </div>
        <span class="ago">${ago(it.createdAt)}</span>
      </div>`).join('')+'</div>';
  }catch{$('adminH').innerHTML='<div class="empty">Error loading history</div>'}
}

async function markPlayed(id){
  try{
    const r=await fetch(API+'/api/requests/'+id+'/played',{method:'POST',headers:hdrs()});
    if(!r.ok){toast('Failed','err');return}
    toast('Marked as played','ok');loadAll();
  }catch{toast('Network error','err')}
}

async function removeItem(id){
  try{
    const r=await fetch(API+'/api/requests/'+id,{method:'DELETE',headers:hdrs()});
    if(!r.ok){toast('Failed','err');return}
    toast('Removed','ok');loadAll();
  }catch{toast('Network error','err')}
}

$('refreshBtn').addEventListener('click',loadAll);

function ago(iso){
  const s=Math.floor((Date.now()-new Date(iso))/1000);
  if(s<60)return 'just now';
  if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}
function toast(msg,type){
  const t=$('toast');t.textContent=msg;t.className='toast '+type+' show';
  setTimeout(()=>t.classList.remove('show'),2500);
}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
</script>
</body>
</html>
